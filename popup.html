<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWEA Session Keeper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>SWEA Session Keeper</h1>

    <div class="row">
      <span>상태</span>
      <label class="switch">
        <input id="enabled" type="checkbox">
        <span class="slider"></span>
      </label>
    </div>

    <label class="field">
      <span>요청 간격</span>
      <select id="interval">
        <option value="1">1분</option>
        <option value="3">3분</option>
        <option value="5">5분</option>
        <option value="10">10분</option>
        <option value="15">15분</option>
      </select>
    </label>

    <div class="info">
      <div><span>마지막 요청</span><strong id="lastRequest">없음</strong></div>
      <div><span>결과</span><strong id="lastResult">대기 중</strong></div>
    </div>

    <button id="pingNow">지금 요청 보내기</button>

    <p class="note">
      SWEA 탭이 없어도 요청합니다. 로그인 상태여야 합니다.
    </p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
